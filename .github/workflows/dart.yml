# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Sets up the Flutter SDK (which includes the Dart SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify code formatting on each commit.
      # - name: Verify formatting
      #   run: flutter format --set-exit-if-changed .

      # Analyzes the Flutter project for potential issues or warnings.
      - name: Analyze project source
        run: flutter analyze

      # Runs the Flutter unit and widget tests.
      - name: Run tests
        run: flutter test
